<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>公民练习室</title>
<style>
:root{--paper:#f6f6f0;--ink:#233b3b;--muted:#7b8581;--line:#e4e7dd;--green:#244f45;--orange:#c97147}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}
form{width:min(380px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px 26px}
.mark{font-size:34px;line-height:1;color:var(--orange)}
h1{margin:12px 0 4px;font-size:22px;font-weight:600}
p{margin:0 0 20px;font-size:13px;line-height:1.7;color:var(--muted)}
label{display:block;font-size:13px}
#password{display:block;width:100%;margin-top:6px;padding:11px 12px;border:1px solid #d6ddcf;border-radius:9px;font-size:16px;color:var(--ink)}
#password:focus{outline:2px solid #91a893;outline-offset:1px}
.remember{display:flex;gap:8px;align-items:center;margin:14px 0 18px;color:var(--muted)}
.remember input{width:16px;height:16px;margin:0;accent-color:var(--green)}
button{width:100%;padding:12px;border:0;border-radius:9px;background:var(--green);color:#fff;font-size:15px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#error{min-height:20px;margin:12px 0 0;font-size:13px;color:#b0532b}
</style>
</head>

</form>

const STORE='civics.unlock.v1';
const bytes=text=>Uint8Array.from(atob(text),c=>c.charCodeAt(0));
const base64=buffer=>btoa(String.fromCharCode(...new Uint8Array(buffer)));
const $=id=>document.getElementById(id);
async function derive(password){
 const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(password.trim().toLowerCase()),'PBKDF2',false,['deriveBits']);
 return crypto.subtle.deriveBits({name:'PBKDF2',salt:bytes(LOCK.salt),iterations:LOCK.iterations,hash:'SHA-256'},base,256);
}
async function decrypt(raw){
 const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
 return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(LOCK.iv)},key,bytes(LOCK.data)));
}
// document.open() only replaces the page once it has finished loading; earlier, the practice page
// would be appended to this one (a remembered key decrypts that fast).
async function show(html){
 if(document.readyState!=='complete')await new Promise(done=>window.addEventListener('load',done,{once:true}));
 document.open();document.write(html);document.close();
}
// A remembered key only fits this build's salt, so a new password simply asks again.
function remembered(){try{const s=JSON.parse(localStorage.getItem(STORE));return s&&s.salt===LOCK.salt?bytes(s.key):null;}catch{return null;}}
function remember(raw){try{localStorage.setItem(STORE,JSON.stringify({salt:LOCK.salt,key:base64(raw)}));}catch{}}
function forget(){try{localStorage.removeItem(STORE);}catch{}}
$('unlock').addEventListener('submit',async event=>{
 event.preventDefault();
 $('enter').disabled=true;$('enter').textContent='正在打开…';$('error').textContent='';
 let raw,html;
 try{raw=await derive($('password').value);html=await decrypt(raw);}
 catch{$('error').textContent='密码不对，请再试一次。';$('enter').disabled=false;$('enter').textContent='进入';$('password').select();return;}
 if($('remember').checked)remember(raw);else forget();
 await show(html);
});
(async()=>{
 if(!window.crypto?.subtle){$('unlock').hidden=false;$('enter').disabled=true;$('error').textContent='这个浏览器打不开，请用新版 Chrome、Edge 或 Safari。';return;}
 const raw=remembered();
 if(raw){try{await show(await decrypt(raw));return;}catch{forget();}}
 $('unlock').hidden=false;$('password').focus();
})();
</script>
